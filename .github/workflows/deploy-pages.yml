name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # daily_news가 GITHUB_TOKEN으로 push하면 push 트리거가 막히므로 workflow_run으로 재배포
  workflow_run:
    workflows: ['Daily AI News Fetcher']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

    steps:
      # workflow_run.head_sha는 Fetcher가 뉴스를 커밋하기 '이전' 커밋이라 쓰지 않는다.
      # 기본값(github.sha)은 트리거 시점의 main 최신 커밋 = 방금 푸시된 뉴스 포함.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  # 업로드 직후 같은 job에서 배포하면 아티팩트가 아직 조회되지 않아 실패하는 경우가 있어 job을 분리한다 (GitHub 공식 템플릿 구조).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
